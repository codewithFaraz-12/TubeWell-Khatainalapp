name: Build TubeWell Khata Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install project dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build web application
        run: npm run build

      - name: Prepare Capacitor Android
        run: |
          if [ ! -f android/gradlew ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Install and validate real Firebase Android config
        run: |
          test -f config/google-services.json || { echo 'Missing config/google-services.json'; exit 1; }
          mkdir -p android/app
          cp config/google-services.json android/app/google-services.json
          node - <<'NODE'
          const fs = require('fs');
          const j = JSON.parse(fs.readFileSync('android/app/google-services.json','utf8'));
          if (j.project_info?.project_id !== 'gen-lang-client-0211199320') throw Error('Wrong Firebase project');
          const c = j.client?.find(x => x.client_info?.android_client_info?.package_name === 'com.tubewellkhata.app');
          if (!c) throw Error('Wrong Android package in google-services.json');
          if (!c.oauth_client?.some(x => x.client_type === 1)) throw Error('Missing Android OAuth client: register signing SHA-1 in Firebase and download fresh JSON');
          if (!c.oauth_client?.some(x => x.client_type === 3)) throw Error('Missing Web OAuth client');
          console.log('Firebase Android JSON structure verified.');
          NODE

      - name: Configure Google Services Gradle plugin
        run: |
          python3 - <<'PYGRADLE'
          from pathlib import Path
          root=Path('android/build.gradle')
          app=Path('android/app/build.gradle')
          s=root.read_text()
          if 'com.google.gms:google-services:' not in s:
              needle='dependencies {'
              if needle not in s:
                  raise SystemExit('Missing buildscript dependencies in android/build.gradle')
              s=s.replace(needle, "dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'",1)
              root.write_text(s)
          s=app.read_text()
          if "apply plugin: 'com.google.gms.google-services'" not in s:
              app.write_text(s+"\napply plugin: 'com.google.gms.google-services'\n")
          PYGRADLE

      - name: Configure native Google OAuth server client ID
        run: |
          python3 - <<'PYXML'
          from pathlib import Path
          import re, json
          cfg=json.loads(Path('firebase-applet-config.json').read_text())
          client=cfg['oAuthClientId']
          f=Path('android/app/src/main/res/values/strings.xml')
          s=f.read_text()
          entry=f'<string name="server_client_id">{client}</string>'
          if 'name="server_client_id"' in s:
              s=re.sub(r'<string name="server_client_id">[^<]*</string>',entry,s)
          else:
              s=s.replace('</resources>',f'    {entry}\n</resources>')
          f.write_text(s)
          PYXML

      - name: Use persistent development signing key and show fingerprint
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'Missing ANDROID_KEYSTORE_BASE64 secret'; exit 1; }
          mkdir -p ~/.android
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore
          echo 'APK signing key SHA fingerprints (must be registered in Firebase):'
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android | grep -E 'SHA1:|SHA256:'
          python3 - <<'PYSHA'
          import json,subprocess,re
          j=json.load(open('config/google-services.json'))
          clients=j['client'][0]['oauth_client']
          known={x.get('android_info',{}).get('certificate_hash','').lower() for x in clients if x['client_type']==1}
          out=subprocess.check_output(['keytool','-list','-v','-keystore',str(__import__('pathlib').Path.home()/'.android/debug.keystore'),'-storepass','android','-alias','androiddebugkey','-keypass','android'],text=True)
          sha=re.search(r'SHA1:\s*([A-F0-9:]+)',out)
          if not sha: raise SystemExit('Cannot determine signing SHA-1')
          fp=sha.group(1).replace(':','').lower()
          if fp not in known:
              raise SystemExit('ERROR: Signing SHA-1 is not registered in bundled google-services.json. Build stopped.')
          else:
              print('Bundled Android OAuth certificate matches APK signing SHA-1.')
          PYSHA

      - name: Force APK to use Firebase-registered signing key
        run: |
          cat >> android/app/build.gradle <<'GRADLESIGN'
          android {
              signingConfigs {
                  debug {
                      storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          GRADLESIGN

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Verify REAL APK signing certificate
        run: |
          python3 - <<'PYSIGN'
          import glob, json, os, re, subprocess

          tools = glob.glob(os.path.join(
              os.environ["ANDROID_HOME"], "build-tools", "*", "apksigner"
          ))
          if not tools:
              raise SystemExit("ERROR: apksigner not found")

          apk = "android/app/build/outputs/apk/debug/app-debug.apk"
          output = subprocess.check_output(
              [sorted(tools)[-1], "verify", "--print-certs", apk],
              text=True
          )

          match = re.search(
              r"Signer #1 certificate SHA-1 digest:\s*([0-9a-fA-F:]+)",
              output
          )
          if not match:
              raise SystemExit("ERROR: Cannot read real APK certificate")

          actual = match.group(1).replace(":", "").lower()

          key_output = subprocess.check_output([
              "keytool", "-list", "-v",
              "-keystore", os.path.expanduser("~/.android/debug.keystore"),
              "-storepass", "android",
              "-alias", "androiddebugkey",
              "-keypass", "android"
          ], text=True)

          expected_match = re.search(
              r"SHA1:\s*([0-9A-Fa-f:]+)", key_output
          )
          if not expected_match:
              raise SystemExit("ERROR: Cannot read configured key")

          expected = expected_match.group(1).replace(":", "").lower()

          config = json.load(open("config/google-services.json"))
          registered = {
              x.get("android_info", {}).get("certificate_hash", "").lower()
              for c in config["client"]
              for x in c.get("oauth_client", [])
              if x.get("client_type") == 1
          }

          print("Actual APK SHA-1:", actual)
          print("Expected key SHA-1:", expected)

          if actual != expected or actual not in registered:
              raise SystemExit("ERROR: APK signing mismatch! Build rejected.")

          print("SUCCESS: Real APK signature matches Firebase!")
          PYSIGN

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TubeWell-Khata-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
